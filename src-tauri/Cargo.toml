[package]
name = "vasyavig"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasyavig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
notify = "8.2.0"
zspell = { version = "0.5.5", features = ["unstable-suggestions"] }
anydoc = { path = "../vendor/anydoc" }

# HTTP/SSE для ассистента: только OpenAI-совместимый endpoint модели.
# В reqwest 0.13 `default-tls` — это rustls/aws-lc (C-сборка); берём явный
# native-tls = schannel на Windows, без ring/aws-lc.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "system-proxy"] }
futures-util = "0.3"
# Отмена должна срабатывать и на «зависшем» стриме, не дожидаясь таймаута.
tokio = { version = "1", features = ["time", "macros"] }

# Fernet (AES-128-CBC + HMAC-SHA256) — чистые Rust-крейты, без OpenSSL.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.10"

# Отключение browser accelerator keys WebView2 (Ctrl+P = печать и пр.) —
# версии повторяют транзитивные зависимости tauri/wry (Cargo.lock унифицирует)
[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows-core = "0.61"

